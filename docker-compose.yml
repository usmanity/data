services:
  postgres:
    image: postgres:16-alpine
    container_name: fernloop-template-postgres
    environment:
      POSTGRES_DB: fernloop_template
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fernloop_template"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

